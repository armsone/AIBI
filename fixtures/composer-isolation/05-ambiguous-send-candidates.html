<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Composer Isolation Fixture 05 - Ambiguous Send Candidates</title>
</head>
<body>

  <!-- Synthetic sanitized fixture. No real prompts/answers/private content. -->
  <!-- Scenario: Ambiguous Send Candidates within Composer Scope -->
  <div id="fixture-ambiguous-send-candidates">
    <form class="ambiguous-composer" data-testid="composer">
      <!-- aria-label contains "prompt" to match the Gemini registry promptInput selector
           textarea[aria-label*='prompt' i] exactly (not a fixture-only override). -->
      <textarea class="prompt-input" aria-label="Prompt input" placeholder="Write something..."></textarea>
      <div class="button-group">
        <!-- Two active visible submit candidates create ambiguity; runtime must reject rather than mis-click -->
        <button type="submit" aria-label="Send primary" class="send-btn">Send 1</button>
        <button type="submit" aria-label="Send secondary" class="send-btn">Send 2</button>
      </div>
    </form>
  </div>

</body>
</html>
